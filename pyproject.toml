[project]
name = "warden"
version = "0.1.0"
description = "Autonomous hunt → plan → fix → verify → PR agent on Nebius Token Factory Sandboxes with NVIDIA Nemotron."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Moiz Lakkadkutta" }]
dependencies = [
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer-slim>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "tavily-python>=0.5",
  "contree-sdk",
  "contree-client",
]

[project.optional-dependencies]
console = ["fastapi>=0.115", "uvicorn>=0.30"]
gif = [
    "pillow>=10.4",
]

[project.scripts]
warden = "warden.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"warden/runlog/render.py" = ["E501"]
"warden/hunt/**" = ["E501"]
"warden/verify/gate.py" = ["E501"]
"warden/verify/race.py" = ["E501"]
"warden/fix/implementer.py" = ["E501"]
"warden/integrate/merger.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real Nebius/Tavily APIs (manual only)"]
addopts = "-m 'not live'"
